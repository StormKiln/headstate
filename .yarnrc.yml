nodeLinker: node-modules

# Supply-chain gates, all three of which Yarn 4.18 would otherwise have
# written here as the OLD behaviour on migration from 4.5.
#
# `npmMinimalAgeGate`: a version published to npm less than a week ago is
# not a candidate for resolution. A poisoned release is usually pulled
# within hours or days of publication, so a fresh resolve that waits a
# week never sees it. Only RESOLUTION is gated: versions already in
# yarn.lock install as before, and `dependabot.yml`'s `cooldown` mirrors
# this so its pull requests wait the same week rather than fail here.
# `npmPreapprovedPackages` exempts a package from the gate if one ever
# has to move faster than that.
npmMinimalAgeGate: 7d

# Off by default since 4.13 and left off: nothing in this tree needs a
# lifecycle script to install, and an install script is exactly how a
# poisoned package runs code. If a future dependency does need one,
# allow it alone through `dependenciesMeta.<name>.built: true`.
enableScripts: false
