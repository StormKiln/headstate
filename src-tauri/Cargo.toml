[package]
name = "headstate"
version = "0.1.0"
license = "Apache-2.0"
description = "Your work. Your pull requests. One clear status."
repository = "https://github.com/pktstorm/headstate"
edition = "2021"

[lib]
name = "headstate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` is load-bearing for `claude/install.rs`, which edits a
# file Headstate does not own: `~/.claude/settings.json`.
#
# Without it a `serde_json::Value` object is a `BTreeMap`, so every write
# SORTS the document's keys. The installer appends two hook matchers and must
# leave the rest of the file alone -- and a sorted rewrite is not leaving it
# alone. Someone who hand-ordered their settings, or who keeps them in git,
# would get one line changed by us and the whole file reordered by the
# serialiser.
#
# It also decides our own matcher's shape: `hooks` then `_headstate`, and
# `type` then `command`, are insertion order; sorting reverses both.
#
# Found by SABOTAGE rather than foresight, and the reason it was nearly
# missed is worth recording: Claude Code writes that file with its keys
# already sorted -- measured, twelve top-level keys and ten hook events, both
# exactly alphabetical -- so every round-trip test built from the real file's
# shape passed either way. `install::tests::a_hand_ordered_document_keeps_its_key_order`
# is the guard, and it uses a deliberately non-alphabetical document.
#
# Adds no new code to the supply chain: it pulls `indexmap`, which is already
# compiled into this tree at 2.14.0. Enabling it added exactly one line to
# `Cargo.lock`.
serde_json = { version = "1", features = ["preserve_order"] }
# `rustls-webpki-tokio` is load-bearing, not decoration. Without it
# hyper-rustls falls back to its default feature `native-tokio`, which is
# `rustls-native-certs` -- certificates read from the SYSTEM KEYCHAIN at
# runtime. `load_native_certs` returns errors rather than panicking, so a
# keychain that is empty, restricted by MDM, or unreadable to a sandboxed
# app yields ZERO roots: every TLS handshake fails, and the user sees a
# transport or parse error with nothing to act on.
#
# That is machine-dependent by construction, which is why a release build
# failed on one Mac while a dev build of the same commit worked on
# another.
#
# The app talks to exactly one host over public CAs, so it does not need
# the user's trust store. The trade: a bundled root store does NOT pick up
# an enterprise MITM proxy's custom CA, so anyone behind one would need
# the native store instead. Silent failure on an ordinary machine is the
# worse of the two, but this is a choice rather than an oversight.
octocrab = { version = "0.54", default-features = false, features = [
  "follow-redirect", "retry", "rustls", "timeout", "tracing",
  "default-client", "rustls-ring", "rustls-webpki-tokio", "jwt-aws-lc-rs",
] }
rusqlite = { version = "0.40", features = ["bundled"] }
# ALREADY in the tree at this version, pulled in by tauri's build stack --
# declaring it adds no new code to the supply chain.
#
# For the Cargo ecosystem (`packages/cargo.rs`), which reads `Cargo.toml`
# and `Cargo.lock`. Both are TOML with quoted keys, dotted keys, inline
# tables and arrays of tables; hand-scanning them the way `swift.rs`
# scans JSON would get the awkward shapes wrong in exactly the quiet
# ways that module refuses. Reading only; the WRITE side is `toml_edit`.
toml = "1.1"
# ALREADY in the tree at this version, underneath `toml` itself -- so
# declaring it adds no new code to the supply chain.
#
# The write half of the Cargo ecosystem (`packages/cargo_apply.rs`).
# `toml` round-trips through a value model and would reformat the whole
# file; `toml_edit` keeps a format-preserving document, which is the
# only reason an apply can leave the why-comment above a dependency
# alone. That is not a nicety here: nearly every dependency in this
# repository carries one, and losing them is precisely why #560 refused
# to ship an apply button.
toml_edit = "0.25"
tokio = { version = "1.53", features = ["full"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
# Needed to reconstruct Poetry's venv naming, which is
# base64(sha256(project path))[:8].
#
# `sha2` 0.11 is the version that matters: it is on `digest` 0.11, the
# same stack `ml-dsa` already brings through `shake`, and moving it in
# step with `p256` 0.14 and `hmac` 0.13 below leaves the tree with ONE
# digest stack instead of the two it used to carry. See the `p256` note
# for the whole argument -- the four move together or not at all, and
# they move in `src-mobile/Cargo.toml` in the same change.
#
# `base64` 0.23 is the exception to that coupling: it is a plain encoder
# with no digest underneath, so it is free to move on its own. Note it
# does NOT replace the 0.22 in the tree -- hyper-util still pulls that
# one, so this is a second copy rather than a shared one. It is here
# because both apps should spell the same version, and because the phone
# already resolves 0.23 transitively through rcgen's `pem`.
sha2 = "0.11"
base64 = "0.23"
# ALSO already in the tree, pulled in by octocrab at this version.
#
# Needed by the two ecosystems whose "latest version" answer comes from
# an HTTP registry rather than a local command: Terraform providers and
# Swift packages.
#
# `json` ONLY. The obvious `rustls` feature pulls in quinn (QUIC) and a
# crypto stack -- 125 new lock entries -- despite the crate already being
# present. With json alone the lock grows by one line, which is what
# "already in the tree" is supposed to mean.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
# For the crypto provider reqwest needs at runtime. Already in the tree
# via octocrab, which is built with `rustls-ring` -- matching that here
# means no second implementation is compiled in.
#
# `aws_lc_rs` AS WELL, for the phone listener (`remote/listener.rs`): it
# is the only rustls provider with a post-quantum key exchange
# (X25519MLKEM768), which the mobile companion design requires so PR
# titles recorded off the wire today stay private. The crate itself was
# already compiled in -- octocrab's `jwt-aws-lc-rs` feature pulls
# `aws-lc-rs` 1.18 -- so this enables rustls' bindings to it rather than
# adding a second crypto library.
#
# Two providers compiled in means rustls no longer has an unambiguous
# default: any `ClientConfig::builder()` in a dependency panics with
# "no process-level CryptoProvider available" unless one is installed
# first. `lib.rs` installs `ring` as the process default at startup, so
# octocrab and reqwest keep using exactly what they used before; the
# listener picks the aws-lc-rs provider explicitly per `ServerConfig`
# and never relies on the default.
#
# ML-DSA comes from that provider directly as of 0.23.44. It used to
# need `rustls-post-quantum`, whose `provider()` was aws-lc-rs plus
# ML-DSA signing keys and verifiers that rustls only NAMED; both halves
# of that are now in `aws_lc_rs::default_provider()`, which loads an
# ML-DSA key and whose `signature_verification_algorithms` table is
# byte-identical to the post-quantum crate's -- ML_DSA_44, ML_DSA_65 and
# ML_DSA_87 included. Measured, not assumed (#588).
#
# Dropping it also dropped two features it was turning on here, and the
# second is worth understanding rather than just noting.
#
# `rustls-webpki/aws-lc-rs-unstable` turned out not to be where the
# ML-DSA verifiers come from at all -- the table above is the
# provider's, on both providers alike.
#
# `prefer-post-quantum` is one of rustls's OWN default features, and
# every manifest here declares rustls with `default-features = false`,
# so it was off by our choice. `rustls-post-quantum` then depended on
# rustls WITHOUT disabling defaults, which turned it back on across the
# whole graph -- features being additive. Removing the crate returns
# rustls to what this manifest actually asked for, which is why
# `cargo tree -e features` loses both `default` and
# `prefer-post-quantum` in the same change.
#
# What that feature does is order X25519MLKEM768 first. `listener.rs`
# and `client.rs` spell that order out in `kx_groups` instead of
# inheriting it, precisely "so the preference does not depend on a
# feature flag anyone can drop by accident" -- and this is the change
# that dropped it. `key_exchange_is_hybrid_post_quantum` holds it.
#
# This does NOT get the tree off unstable features: `rcgen` needs
# `aws_lc_rs_unstable` independently, for `PKCS_ML_DSA_65`.
rustls = { version = "0.23", default-features = false, features = ["ring", "aws_lc_rs"] }
# The identity's private key, re-derived from its stored 32-byte FIPS
# 204 seed (`PqdsaKeyPair::from_seed`): rcgen can mint an ML-DSA key but
# not load one, and the seed is what the keychain holds because the
# certificate does not fit a Windows credential. Already in the tree
# through rustls, declared the way rustls declares it.
aws-lc-rs = { version = "1.18", default-features = false }
# The phone listener's TLS-over-tokio adapter. Already in the tree via
# hyper-rustls, with default features OFF so it does not re-enable TLS
# 1.2 -- the listener is TLS 1.3 only.
tokio-rustls = { version = "0.26", default-features = false }
# The desktop's own identity: an ML-DSA-65 key and a self-signed
# certificate, generated once and pinned by fingerprint on the phone.
# `aws_lc_rs_unstable` is where rcgen 0.14 keeps `PKCS_ML_DSA_65`; the
# `ring` backend cannot mint one, so it is gone from here (ring itself
# stays, for octocrab). `pem` off because nothing is ever written as PEM.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "aws_lc_rs", "aws_lc_rs_unstable"] }
# The phone listener's HTTP surface (`/v1/hello`, and later
# `/v1/pair`, `/v1/call`, `/v1/events`). Minimal features: the surface is
# four JSON endpoints over HTTP/1.1, so no forms, query strings, tracing
# or HTTP/2.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
# Serving each accepted TLS connection by hand rather than through
# `axum::serve`, which only speaks plain TCP: the listener has to run
# the rustls handshake first and then record the peer certificate's
# fingerprint on every request, which needs hyper's per-connection API.
# All three are already in the tree via octocrab and reqwest.
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tower-service = "0.3"
# The `/v1/events` stream (`remote/events.rs`): axum's `Sse` takes a
# `Stream`, and `stream::unfold` is what turns a broadcast receiver plus
# a revocation watch into one without a hand-written poll function.
# Already in the tree via axum and hyper; default features off so it
# stays the subset they already compile.
futures-util = { version = "0.3", default-features = false }
# The listener's dual-stack socket (`remote/listener.rs`). Binding the
# IPv6 wildcard through `TcpListener::bind` gives an IPv6-ONLY socket on
# Windows (`IPV6_V6ONLY` defaults on there and off on Linux and macOS),
# while the pairing QR lists the machine's IPv4 addresses too; std has
# no way to clear the option, socket2 does. Already in the tree via
# tokio and hyper-util, at this version.
socket2 = "0.6"
# The desktop identity's private key goes in the platform keychain --
# Keychain Services on macOS, Credential Manager on Windows, the
# Secret Service (via a pure-Rust D-Bus client, no libdbus) on Linux.
# Headstate stored no credential of its own before this; the GitHub
# token is read from `gh`. See `remote/identity.rs` for the Linux
# fallback when no Secret Service daemon is running.
keyring = "4.2"
tauri-plugin-log = "2.9.0"
# Auto-update. Verifies an Ed25519 signature over each bundle with the
# public key in `tauri.conf.json` -- separate from Apple code signing
# (#23) and not a substitute for it: this proves the archive came from
# our release pipeline, not that macOS trusts the app.
tauri-plugin-updater = "2"
# The updater needs to restart the app to apply an update.
tauri-plugin-process = "2"
log = "0.4.33"
tauri-plugin-notification = "2.3.3"
# Start at login. A tray app whose value is a live badge while hidden is
# weakened by requiring a manual launch every boot.
tauri-plugin-autostart = "2.5.1"
# Opening a URL in the user's browser. A plain `target="_blank"` anchor
# does nothing in a packaged Tauri window -- there is no browser context
# to open a tab in -- so every external link in the app was inert. It
# works in `tauri dev`, which is why nobody noticed.
tauri-plugin-opener = "2"
# Mobile pairing (remote/pairing.rs). The phone proves it holds the pairing
# token with an HMAC-SHA256 over both certificate fingerprints. 0.13 to
# share `digest` 0.11 with the `sha2` above and the `p256` below -- the
# reason 0.12 was pinned here before was to share 0.10 with them, and it
# is the same reason now that they have all moved together. Verification
# goes through the crate's constant-time `verify_slice`, never a `==` on
# bytes.
hmac = "0.13"
# Constant-time comparison of the presented pairing token against the
# issued one. Already in the tree (hmac and rustls both use it).
subtle = "2"
# 32 random bytes for the pairing token. Already in the tree at this
# version; `rand::rng()` is OS-seeded ChaCha, which is what a bearer token
# needs.
rand = "0.9"
# Every non-loopback address of this machine, for the pairing QR payload
# -- std has no interface enumeration. One crate over `getifaddrs` with
# only `libc` beneath it, which is already in the tree.
if-addrs = "0.15"
# Step-up signatures on destructive remote commands (remote/stepup.rs):
# the classical half of the hybrid. `ecdsa` alone: the phone's key
# arrives as raw SEC1 bytes and its signature as raw r||s, so there is no
# PEM or PKCS#8 to parse. Signing is compiled in only so the tests can
# make keys; the desktop never signs.
#
# 0.14 now, and the reason is the one that used to argue for 0.13. That
# note said 0.14 "would bring a second copy" of `digest`, `sha2` and
# `signature` -- true when it was written, but only because the rest of
# the tree sat on the 0.10 stack. It does not any more: `ml-dsa` 0.1.1
# pulls `digest` 0.11 through `shake` and `signature` 3.0 directly, so
# 0.13 was the version costing a second copy, not 0.14.
#
# Measured on the resolved graph rather than assumed. p256 0.14 needs
# ecdsa 0.17 -> digest 0.11 + signature 3.0, which is exactly what
# ml-dsa already uses, and p256 depends on `sha2` itself -- 0.13 pins
# sha2 0.10, which is what kept the old stack alive. With sha2 0.11 and
# hmac 0.13 above, the whole tree resolves to ONE each of `digest`
# 0.11, `signature` 3.0, `crypto-common` 0.2 and `block-buffer` 0.12.
# So this collapses the two digest stacks; it does not entrench them.
#
# Nothing on the wire moves. A P-256 signature is still the fixed-width
# 64-byte r||s of IEEE P1363 (`Signature::from_slice` in ecdsa 0.17 is
# the same fixed-width parse), and the key is still SEC1 uncompressed,
# so a phone signing with the old version and a desktop verifying with
# the new one still agree. The version must still MATCH
# `src-mobile/Cargo.toml`, not because the bytes would differ but
# because these two ends are meant to be read as one decision.
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
# The post-quantum half: ML-DSA-65 verification, FIPS 204 final. Chosen
# over `libcrux-ml-dsa` for reasons recorded in remote/stepup.rs. No
# build script; `alloc` boxes the large intermediate matrices instead of
# putting them on a tokio worker's stack. Its `digest` 0.11, through
# `shake`, used to be a SECOND digest stack alongside the 0.10 that
# `p256` 0.13 and `sha2` 0.10 sat on; since those moved to the 0.11 line
# it is the only one, and this crate is what the rest now matches.
# ml-dsa 0.0.x on digest 0.10 predates the Wycheproof and use_hint fixes
# in 0.1.0 and is not an option for a verifier.
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc"] }
# The step-up signature contract itself: canonical bytes, the header
# grammar, and `verify`. In-repo, and the ONLY place any of that exists
# -- the phone (`src-mobile`) and its keys plugin depend on this same
# crate by path, so a change to the signed bytes or the grammar changes
# BOTH ends or neither. It used to exist twice, once here and once
# hand-written in the companion's own tests, which is the drift #695
# describes: two suites green, each agreeing only with its own copy of
# the rules. The version is stated so the path dependency is not a
# wildcard for `cargo deny`.
#
# This is also what turns the p256/ml-dsa/sha2/hmac lockstep argued
# above into a rule the compiler enforces rather than a comment anyone
# can contradict -- #585 found two that did. That crate declares the
# same versions, so a bump on one side alone fails to resolve.
headstate-stepup = { version = "0.1.0", path = "../crates/headstate-stepup" }
# LAN discovery (remote/discovery.rs). Advertises `_headstate._tcp` while
# the listener is up so a phone whose stored address went stale can still
# find this desktop. Pure Rust over `socket2` and the `if-addrs` above --
# no Bonjour, Avahi, or dns-sd FFI, which is what makes Windows and Linux
# best-effort rather than a build dependency. No `async` feature: the
# daemon runs its own thread and the handful of calls we make are channel
# sends, so pulling flume's async half in would buy nothing.
mdns-sd = { version = "0.21", default-features = false, features = ["logging"] }
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network", "component"] }

# For `getpriority(2)` only -- the nice value, which #865 needs and
# `sysinfo` does not expose (0.39 has no `nice` or `priority` accessor
# anywhere in the crate; checked rather than assumed).
#
# Not a new supply-chain edge: `libc` is already in `Cargo.lock`
# transitively, pulled by `sysinfo` itself among others. This declares a
# direct dependency on a crate that was already being compiled.
#
# Unix only. Windows has no nice, so the reader returns `None` there and
# the rules treat that as "cannot say" rather than as zero -- the same
# absent-is-not-zero rule the rest of `health` follows.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
temp-env = "0.3"
tempfile = "3"
wiremock = "0.6"

# `float_cmp` is not in clippy's default set; it is a `pedantic` lint that
# #892's audit measured as the one pedantic lint worth having here. Eight
# hits across this crate, six of them `assert_eq!` expansions on exact
# literal round-trips (map.rs, store/health.rs) -- correct code, and the
# `allow`s below say so in place rather than turning the lint off.
#
# The two real hits are fixed: health/alerts.rs compared a sampled
# percentage against a literal to mean "the first iteration", and
# health/footprint.rs asserted a sort order with raw `>`/`==` instead of
# the total order `top_by` actually sorts by -- which also answered FALSE
# for a NaN, so the assertion misreported the one input `Ordered` exists
# to handle.
#
# Declared HERE rather than as a `-W` flag on a new CI step, for two
# reasons. `[lints]` travels with the crate, so `make lint-rust`, the
# `Clippy` step in ci.yml, and anyone's bare `cargo clippy` all ask the
# same question -- and it costs zero additional CI time, because it runs
# inside a clippy invocation that already happens.
[lints.clippy]
float_cmp = "deny"
