# Default graph covers macOS. `make deny` also audits Windows separately:
# a combined target graph unions Unix updater archive features into Windows,
# reporting a ZIP edge that the actual Windows build does not compile.
# Linux GTK dependencies require separate platform triage.
[graph]
targets = [
  { triple = "aarch64-apple-darwin" },
  { triple = "x86_64-apple-darwin" },
]

[advisories]
version = 2

# Each ignore is a deliberate, documented acceptance -- never a blanket mute.
# The gate still fails on anything NEW, which is the whole point of having it.
#
# RUSTSEC-2025-0075/0080/0081/0098/0100: the unic-* Unicode crates are
# unmaintained (the whole open-i18n/rust-unic project is). They reach us only
# through tauri-utils -> urlpattern, so we neither call them directly nor
# choose their version, and RustSec lists no safe upgrade. These are
# "unmaintained" notices, not vulnerabilities: no known exploit, no CVE.
# Revisit when Tauri moves urlpattern off unic (upstream is tracking a switch
# to icu_properties).
ignore = [
  "RUSTSEC-2025-0075",  # unic-char-range unmaintained
  "RUSTSEC-2025-0080",  # unic-common unmaintained
  "RUSTSEC-2025-0081",  # unic-char-property unmaintained
  "RUSTSEC-2025-0098",  # unic-ucd-version unmaintained
  "RUSTSEC-2025-0100",  # unic-ucd-ident unmaintained
]

[licenses]
version = 2
# CDLA-Permissive-2.0 covers `webpki-roots`, which is the Mozilla CA
# bundle -- a DATA licence for the certificate list rather than a code
# licence. It is permissive with no copyleft and no attribution
# obligation, in the same category as CC0-1.0 already on this list.
#
# It arrives with the bundled TLS roots, which the app needs because
# reading certificates from the host keychain made it fail on machines
# whose trust store it could not read.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
         "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0",
         "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
