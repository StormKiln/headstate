[package]
name = "tauri-plugin-headstate-keys"
version = "0.1.0"
license = "Apache-2.0"
description = "Hardware-backed step-up signing keys and the TLS session identity for Headstate Companion."
repository = "https://github.com/pktstorm/headstate"
edition = "2021"
# Required by `tauri_plugin::Builder`: the build script publishes the
# plugin's permission set under this name.
links = "tauri-plugin-headstate-keys"

[lib]
name = "tauri_plugin_headstate_keys"
path = "src/lib.rs"

[build-dependencies]
# Generates the permission files and, on a mobile target, copies the
# Tauri Swift/Kotlin API next to the native sources and links the Swift
# package into the app's static library. Same line as the mobile crate's
# other Tauri crates.
tauri-plugin = { version = "2.6", features = ["build"] }

[dependencies]
# No default features: the plugin needs only the plugin-handle API, and
# the app decides what else Tauri links.
tauri = { version = "2.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4.34"
thiserror = "2"
# The native sides speak JSON, and JSON has no bytes: every key,
# signature and DER blob crosses the bridge as standard base64 with
# padding, the same encoding the pair request uses for the public keys.
# 0.23 to match `src-mobile/Cargo.toml` and the desktop; the alphabet and
# the `Engine` API are unchanged, so this is the version spelling
# agreeing across the three manifests rather than a behaviour change.
base64 = "0.23"
# The session certificate. rustls needs the private key bytes to present
# a client identity, so the session key is made here, not in the
# keystore (see the crate docs). On aws-lc-rs like the rest of the
# mobile crate; `aws_lc_rs_unstable` is where rcgen 0.14 keeps
# `PKCS_ML_DSA_65`, the session key's algorithm since protocol 2 (#521);
# no `pem`, the phone only ever handles DER.
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "aws_lc_rs_unstable"] }
# The session key, re-derived from its stored 32-byte FIPS 204 seed
# (`PqdsaKeyPair::from_seed`): rcgen can mint an ML-DSA key but not load
# one, and the seed is what the native side keeps -- the desktop stores
# its own the same way, so the two sides stay symmetrical. Already in
# the graph through rustls and rcgen, declared the way rustls declares
# it.
aws-lc-rs = { version = "1.18", default-features = false }

[target.'cfg(target_os = "ios")'.dependencies]
# `register_ios_plugin` lives behind `wry`; Tauri's own mobile plugins
# declare it the same way.
tauri = { version = "2.11", default-features = false, features = ["wry"] }

[dev-dependencies]
# The canonical bytes the fake signs, from the crate that DEFINES them
# rather than a copy pasted into a test. This plugin is the third
# manifest under the step-up contract -- #585 named only two -- and it
# carried its own hardcoded 203-byte vector and SHA256, which is the same
# drift #695 is about, one layer down: the desktop could change the
# canonical form and this test would keep signing the old bytes and keep
# passing. Now it calls `canonical_bytes` and there is nothing to drift
# from.
#
# A dev-dependency only. The plugin itself never canonicalises anything:
# it is handed a message to sign and signs it.
headstate-stepup = { version = "0.1.0", path = "../../../crates/headstate-stepup" }
# The fake backend the tests run against signs in software with the same
# crates, versions and features the desktop verifier (src-tauri
# remote/stepup.rs) uses, so "the fake's signature verifies here" means
# "a signature in this encoding verifies there". That equivalence is the
# whole point of these three lines, so they move when the desktop's do --
# p256 0.14 and sha2 0.11 on `digest` 0.11, the versions the shared crate
# above declares for itself. Neither crate is linked into the phone: on a
# device the signer is the Secure Enclave or the Android Keystore.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc"] }
# SHA256 of the canonical-bytes test vector, pinned to the desktop's.
sha2 = "0.11"
# Proves the session identity is what rustls wants: the key loads and
# matches the certificate. Already in the mobile crate's graph, and on
# the same provider the client (src-mobile/src/client.rs) builds on --
# aws-lc-rs, which carries ML-DSA itself as of rustls 0.23.44. This used
# to add `rustls-post-quantum` for that; see src-tauri/Cargo.toml for
# why it went (#588).
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
