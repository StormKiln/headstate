[package]
name = "tauri-plugin-headstate-export"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
links = "tauri-plugin-headstate-export"
[build-dependencies]
tauri-plugin = { version = "2.6", features = ["build"] }
[dependencies]
tauri = { version = "2.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2.11", default-features = false, features = ["wry"] }
