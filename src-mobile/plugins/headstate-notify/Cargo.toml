[package]
name = "tauri-plugin-headstate-notify"
version = "0.1.0"
license = "Apache-2.0"
description = "Local user notifications for Headstate Companion: UNUserNotificationCenter on iOS."
repository = "https://github.com/pktstorm/headstate"
edition = "2021"
# Required by `tauri_plugin::Builder`: the build script publishes the
# plugin's permission set under this name.
links = "tauri-plugin-headstate-notify"

[lib]
name = "tauri_plugin_headstate_notify"
path = "src/lib.rs"

[build-dependencies]
tauri-plugin = { version = "2.6", features = ["build"] }

[dependencies]
# No default features, like `headstate-refresh`: this plugin needs the
# plugin-handle API and nothing else; the app decides what Tauri links.
#
# No `Channel` here, unlike that plugin. Every call runs Rust -> native
# and returns; nothing in iOS's notification API calls back into the app
# for what this does (posting and asking permission), so there is no
# reverse direction to plumb. Notification TAPS would be such a
# callback, and they are deliberately not handled -- see the module docs.
tauri = { version = "2.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4.34"
# One error enum with Display, same as the keys plugin's `error.rs`.
thiserror = "2"

[target.'cfg(target_os = "ios")'.dependencies]
# `register_ios_plugin` lives behind `wry`, same as `headstate-refresh`.
tauri = { version = "2.11", default-features = false, features = ["wry"] }
