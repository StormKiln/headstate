name: Release

on:
  push:
    tags: ["v*"]

# Least privilege, per job rather than per workflow (#886).
#
# This block used to say "only the release job runs, and it needs
# contents:write" while granting it at WORKFLOW level -- so `gate` and all
# three `build` legs held it too. The comment stated the intent correctly
# and the code was broader, which is the shape #886 was filed about.
#
# It matters because the build legs run `yarn install` and `cargo build`
# over the whole dependency tree. A compromised build dependency holding
# contents:write can push to this repository; the same dependency under
# contents:read cannot. That is the blast-radius argument this file
# already makes for pinning every action to a full commit SHA, applied to
# token scope.
permissions:
  contents: read

jobs:
  # CI runs independently on the tag (see ci.yml's `tags:` trigger). This
  # job waits for EVERY check run on the tagged commit to conclude
  # `success` before anything is built or published, so a tag on broken
  # code fails here instead of shipping.
  #
  # "Every check run" and not "every check name" is the whole point, and
  # getting it wrong is how this gate was hollow until #883. Read
  # `wait-for-duplicates` below before changing anything here.
  #
  # Deliberately a wait rather than duplicating the test steps: one
  # definition of "green" means the release cannot pass a gate that CI
  # would have failed.
  #
  # `ignore-checks` excludes the PHONE release's jobs. Without it this
  # waits on every check run attached to the commit, which is a larger
  # set than CI: a `mobile-v*` tag pointing at the same commit as a `v*`
  # tag puts mobile-release.yml's jobs on that commit too, and v5.4.0
  # failed this gate on `ios-release` -- a job that builds no desktop
  # artifact and whose failure says nothing about whether the desktop is
  # releasable. The two pipelines are independent by design (see the
  # header of mobile-release.yml), so neither may hold the other hostage.
  #
  # `ignore-checks` and not `check-name`: the action compares `check-name`
  # to a check's name with a single `==` (app/services/
  # github_checks_verifier.rb, `apply_filters`), so it names exactly ONE
  # check -- a list there matches nothing and fails as "never run".
  # `ignore-checks` is comma-split, and subtracting is also the safer
  # direction: a NEW ci.yml job is waited on automatically, where an
  # allowlist would have silently stopped gating on it.
  #
  # `publish` names a job in BOTH release workflows, so ignoring it
  # covers this file's own `publish` too -- which is what we want. That
  # job is downstream of this gate and reports `skipped` until the gate
  # clears, and `skipped` is not an allowed conclusion; on v5.4.0 the
  # gate's final tally already read `publish: completed (skipped)` and
  # only escaped failing on it because the mobile run's copy was the one
  # that survived name deduplication. A gate cannot wait on a job that
  # waits on the gate.
  #
  # Everything not listed here must still conclude `success`, so this
  # stays as strict as it was for everything CI actually runs.
  #
  # `wait-for-duplicates: true` is what makes the claim at the top of
  # this job TRUE, and without it the gate could be satisfied entirely by
  # a CI run that never tested the tag (#883). Every release tag points at
  # a commit that was ALSO pushed to `main`, so the commit carries two
  # suites with identical job names: v5.14.0 (097a1af) had 25 check runs,
  # 10 names appearing twice. Read from the pinned action's source
  # (app/services/github_checks_verifier.rb at 3697690):
  #
  #   checks = keep_latest_per_name(checks) unless wait_for_duplicates
  #   ...
  #   checks.group_by(&:name).map { |_n, runs| runs.max_by { |r| r.started_at.to_s } }
  #
  # so by default each name collapses to ONE run -- and a tag-suite check
  # that has not registered yet cannot be the max, leaving the already
  # green `main`-push run to answer for it. The usual backstop does not
  # apply: `fail_if_requested_check_never_run` returns early unless
  # `check_name` or `check_regexp` is set (`filters_present?`), and we set
  # neither, so it is inert here.
  #
  # Measured, not hypothetical. On v5.12.0 (7ad496d) the main-push suite
  # completed at 17:25:35Z, 7.5 minutes before `gate` first polled at
  # 17:33:08Z, and 9 of 10 names resolved to that stale suite; the gate
  # was saved only because tag-suite `platform (ubuntu-latest)` had
  # registered by that same second and still read `in_progress`. v5.11.0
  # survived for the same accidental reason. Tag a commit whose `main` CI
  # finished a few minutes earlier and the gate passes in ~15s having
  # waited for nothing.
  #
  # `true` also sets the API's `filter` to `all` rather than `latest`
  # (`options[:filter] = 'all' if wait_for_duplicates`), but that part is
  # belt-and-braces rather than the fix: `filter=latest` deduplicates only
  # WITHIN one check suite, as the action's own comment above
  # `keep_latest_per_name` says, so our cross-suite duplicates survive it
  # either way. Measured on 097a1af, which returns the same 25 runs under
  # `filter=latest` and `filter=all`. The load-bearing half is skipping
  # `keep_latest_per_name`, which is what actually collapsed the two
  # suites to one run per name.
  #
  # Zero false positives: the two suites are the same jobs on the same
  # commit, so requiring both green adds no new way to fail -- it only
  # removes a way to pass without being tested. `ignore-checks` is applied
  # after the fetch and matches by name, so both suites' copies of
  # `publish` and the mobile jobs are still dropped.
  #
  # NOT `check-regexp` to activate the never-run guard instead: a name
  # that never reports is the permanently-unmergeable class ci.yml:388-412
  # warns about.
  gate:
    # 1-8m measured. A gate waiting on a status that never arrives is the
    # exact hang this ceiling exists for -- without it, six hours of a
    # runner (#885).
    timeout-minutes: 30
    # Reads check runs on the tag's commit. `checks: read` is explicit
    # rather than inherited, so tightening the workflow default above
    # cannot silently blind the gate.
    permissions:
      contents: read
      checks: read
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI to pass on this commit
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.sha }}
          repo-token: ${{ github.token }}
          running-workflow-name: gate
          wait-interval: 15
          allowed-conclusions: success
          ignore-checks: ios-release,android-release,publish
          # See the long note above: without this the gate can be answered
          # by the `main`-push suite and never wait for the tag's own CI.
          wait-for-duplicates: true

  build:
    needs: gate
    # Up to ~20m measured for a signed, notarized macOS bundle; 60 leaves
    # room for a slow notarization queue without ever sitting for six
    # hours (#885).
    timeout-minutes: 60
    # Builds and uploads artifacts for `publish` to collect. It creates
    # nothing in the repository, so it does not need write (#886).
    permissions:
      contents: read
    strategy:
      # One platform failing must not cancel the others: a release that
      # advertises three platforms and ships one is worse than a release
      # that shipped nothing, so we want to see every failure at once.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: ""
            bundles: nsis
          - os: ubuntu-latest
            target: ""
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    # Hoisted to job level so the signing step's `if:` can test a plain env
    # var. A step-level `if: secrets.X != ''` is not reliably evaluatable --
    # the secrets context is not guaranteed available there, and the whole
    # workflow fails to start rather than skipping the step.
    env:
      HAS_SIGNING_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # macos-latest runners are Apple Silicon, so aarch64-apple-darwin is
      # present by default. The Intel slice of the universal binary needs
      # its target added explicitly.
      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Drop the third-party lists this project never installs
          # from, then refresh.
          #
          # A bare `apt-get update` refreshes EVERY configured source,
          # and the runner image ships a Google Chrome repository. When
          # that mirror serves a corrupted index the command exits 100
          # and the job dies on a fetch unrelated to the build:
          #
          #   E: Failed to fetch https://dl.google.com/linux/chrome-stable/...
          #      Hash Sum mismatch
          #
          # Seen on two unrelated pull requests across three runs in one
          # afternoon, blocking a release for an hour. See #713.
          #
          # Removing the Chrome list rather than disabling
          # `sources.list.d` wholesale: the first attempt at this used
          # `-o Dir::Etc::sourceparts=-`, which also disabled the
          # UNIVERSE list that lives there -- and every package below is
          # from universe, so the job then failed with "Unable to locate
          # package libwebkit2gtk-4.1-dev". Narrower is correct here.
          #
          # `|| true` so a runner image that stops shipping Chrome does
          # not fail on a missing file.
          sudo rm -f /etc/apt/sources.list.d/*google-chrome* || true
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # macos-latest runners are Apple Silicon, so aarch64-apple-darwin is
      # present by default. The Intel slice of the universal binary needs
      # its target added explicitly.
      - name: Add Intel target
        if: matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin

      # The tag is the single source of truth for the version. Without this,
      # tagging v0.2.0 still produces Headstate_0.1.0_universal.dmg and an
      # About box reading 0.1.0, because Tauri derives both from
      # tauri.conf.json -- a mismatch a user downloading from the release
      # page has no way to explain. Stamping here rather than committing a
      # bump keeps the three version fields from drifting apart, and the
      # edits are never committed: the tag already records the version.
      - name: Stamp version from tag
        # Explicit shell: Windows runners default to PowerShell, where the
        # heredoc below is a parse error. Caught by the v2.0.1-rc.1
        # rehearsal, which is what that tag was for.
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH" >&2; exit 1 ;;
          esac
          python3 - "$VERSION" <<'PY'
          import re, sys
          version = sys.argv[1]

          # Targeted substitution rather than a JSON round-trip: json.dump
          # reflows inline arrays, which would bury the one real change in
          # cosmetic noise in the CI log. Each pattern is anchored to the
          # top-level "version" key, and count=1 stops it reaching a
          # dependency's version further down.
          for path in ("package.json", "src-tauri/tauri.conf.json"):
              text = open(path).read()
              text, n = re.subn(r'("version"\s*:\s*)"[^"]+"', rf'\g<1>"{version}"', text, count=1)
              assert n == 1, f"no version key found in {path}"
              open(path, "w").write(text)

          cargo = open("src-tauri/Cargo.toml").read()
          cargo, n = re.subn(r'^version = "[^"]+"', f'version = "{version}"', cargo, count=1, flags=re.M)
          assert n == 1, "no [package] version found in Cargo.toml"
          open("src-tauri/Cargo.toml", "w").write(cargo)
          print(f"stamped {version}")
          PY
          grep -m1 '"version"' src-tauri/tauri.conf.json
          grep -m1 '^version' src-tauri/Cargo.toml

      # --- Code signing (currently inert; see #23) -----------------------
      #
      # Headstate has no Developer ID Application certificate today (only
      # Apple Distribution / App Store and Apple Development / local-only
      # certs exist, neither usable for signing a binary distributed
      # outside the App Store), so this step has nothing to import and
      # is a no-op. It activates automatically, with no further workflow
      # changes, the moment these repo secrets exist:
      #
      #   APPLE_CERTIFICATE          base64-encoded .p12 export of a
      #                               Developer ID Application certificate
      #   APPLE_CERTIFICATE_PASSWORD password the .p12 was exported with
      #   KEYCHAIN_PASSWORD           any password; used only for the
      #                               throwaway CI keychain created below
      #
      # See CONTRIBUTING.md "Code signing" for the full checklist of what
      # to generate and where to add it.
      - name: Import Apple Developer Certificate
        # macOS only, and explicitly so: `security` and `codesign` do not
        # exist elsewhere, and without the os guard this step would fire on
        # all three runners the moment a signing secret is added.
        if: matrix.os == 'macos-latest' && env.HAS_SIGNING_CERT == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f "$RUNNER_TEMP/certificate.p12"

      # Signing vars are set ONLY when a certificate exists. An absent
      # secret expands to the EMPTY STRING, not to nothing, and Tauri
      # treats a present-but-empty APPLE_CERTIFICATE as "sign this" -- it
      # then runs `security import` on empty input and the whole build
      # fails with "failed to import keychain certificate". Guarding the
      # import step alone is not enough, because Tauri reads the
      # environment itself.
      #
      # Two independent guards, because the failure mode is a silent one:
      #   1. the `${{ x && y || '' }}` conditional keeps the secrets out of
      #      the env when no certificate exists, and
      #   2. the run script explicitly unsets the Apple vars in that case,
      #      so it does not matter whether Actions omits an empty value or
      #      exports it as an empty string.
      - name: Build the bundle
        shell: bash
        env:
          # Tauri's build reads these directly, see
          # https://tauri.app/reference/environment-variables/.
          # APPLE_SIGNING_IDENTITY is left for Tauri to infer from the
          # imported certificate rather than hardcoded, since the identity
          # string is only known once a real cert exists.
          APPLE_CERTIFICATE: ${{ env.HAS_SIGNING_CERT == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ env.HAS_SIGNING_CERT == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          # Notarization: stapled onto the signed bundle by the same
          # `tauri build` invocation when APPLE_ID is present. Requires
          # APPLE_PASSWORD (an app-specific password, not the account
          # password) and APPLE_TEAM_ID alongside it.
          APPLE_ID: ${{ env.HAS_SIGNING_CERT == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ env.HAS_SIGNING_CERT == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.HAS_SIGNING_CERT == 'true' && secrets.APPLE_TEAM_ID || '' }}
          # The UPDATER's own signature, unrelated to Apple signing above.
          # Tauri verifies this Ed25519 signature against the public key
          # in tauri.conf.json before it will install anything, so a
          # bundle built without this key can never be applied as an
          # update -- which is why the build fails loudly below rather
          # than shipping unsignable artifacts.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # REQUIRED even though the key has no password. Without it
          # Tauri prompts on a terminal that does not exist in CI and
          # fails with "Device not configured (os error 6)" -- found by
          # running the signed build by hand before trusting the
          # pipeline with it.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          if [ "${HAS_SIGNING_CERT:-}" != "true" ]; then
            # Belt and braces: Tauri signs when it sees APPLE_CERTIFICATE at
            # all, so an empty value is worse than no value.
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            echo "No signing certificate: building an unsigned bundle."
          fi
          # A missing updater key is a HARD failure, not a warning. An
          # unsigned bundle looks identical in the release but can never
          # be installed as an update -- the plugin rejects it before
          # writing anything to disk. Discovering that from a user
          # report is much worse than failing here.
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not set; updates would be unusable." >&2
            exit 1
          fi
          # Only macOS builds a universal binary; the other targets are
          # the runner's own architecture, so --target is omitted there
          # rather than passed empty.
          if [ -n "${{ matrix.target }}" ]; then
            yarn tauri build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"
          else
            yarn tauri build --bundles "${{ matrix.bundles }}"
          fi

      # macOS ships the .app as a tarball alongside the dmg: the dmg is
      # for humans, the tarball is what an updater or a scripted install
      # can consume.
      #
      # RENAMED, not re-tarred. This step used to build its own tarball
      # with `tar -czf`, which predates the updater and was fine when
      # nothing else produced one. Now Tauri produces a SIGNED tarball,
      # and re-tarring the .app created a second, unsigned archive with
      # the versioned name -- so the signature belonged to a file the
      # manifest never referenced, and v3.11.0's publish correctly
      # refused to advertise an update it could not sign.
      #
      # The `.sig` is renamed alongside it: a signature is only meaningful
      # next to the exact bytes it signs.
      - name: Package the macOS app bundle
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle
          SRC="$BUNDLE/macos/Headstate.app.tar.gz"
          if [ ! -f "$SRC" ]; then
            echo "Tauri did not produce $SRC -- updates would be unsignable." >&2
            exit 1
          fi
          cp "$SRC" "Headstate-${GITHUB_REF_NAME}.app.tar.gz"
          cp "$SRC.sig" "Headstate-${GITHUB_REF_NAME}.app.tar.gz.sig"

      # Tauri notarizes the .app and stops there; the DMG it wraps it in
      # afterwards is signed but never submitted. v5.4.1 shipped exactly
      # that: the .app inside passed `spctl` as "Notarized Developer ID",
      # while the DMG a user actually downloads was rejected as
      # "Unnotarized Developer ID".
      #
      # That distinction is the one that matters, because the quarantine
      # bit lands on the DOWNLOADED file. Gatekeeper checks the DMG on
      # open, so an unnotarized wrapper warns the user before they ever
      # reach the notarized app inside -- which is the warning README
      # says releases no longer have.
      #
      # `notarytool` uploads the DMG, waits, and `stapler` attaches the
      # ticket so it verifies offline. Both are Xcode tools already on
      # the runner. This is a no-op for the .app itself, which Tauri has
      # already stapled.
      - name: Notarize the DMG
        if: matrix.os == 'macos-latest' && env.HAS_SIGNING_CERT == 'true'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle
          DMG=$(find "$BUNDLE/dmg" -maxdepth 1 -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then
            echo "No DMG under $BUNDLE/dmg to notarize." >&2
            exit 1
          fi
          echo "Notarizing $DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m
          xcrun stapler staple "$DMG"

      # Proof, not assumption. The release notes claim the macOS build is
      # notarized off the presence of a SECRET, which says nothing about
      # what the bundler actually did -- v5.4.1 made that claim about a
      # DMG Gatekeeper rejected. This asks the same question a user's Mac
      # asks, and fails the build if the answer is wrong, so the claim
      # can never again outrun the artifact.
      #
      # `spctl -t install` is the DMG's own assessment type; `-t exec` is
      # the app's. Both must come back accepted and notarized.
      - name: Verify the macOS artifacts are notarized
        if: matrix.os == 'macos-latest' && env.HAS_SIGNING_CERT == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle
          DMG=$(find "$BUNDLE/dmg" -maxdepth 1 -name '*.dmg' | head -1)
          APP="$BUNDLE/macos/Headstate.app"

          fail=0
          echo "== DMG =="
          if ! spctl -a -vvv -t install "$DMG" 2>&1 | tee /tmp/dmg.txt; then fail=1; fi
          grep -q 'source=Notarized Developer ID' /tmp/dmg.txt || fail=1
          xcrun stapler validate "$DMG" || fail=1

          echo "== app =="
          if ! spctl -a -vvv -t exec "$APP" 2>&1 | tee /tmp/app.txt; then fail=1; fi
          grep -q 'source=Notarized Developer ID' /tmp/app.txt || fail=1
          xcrun stapler validate "$APP" || fail=1

          if [ "$fail" -ne 0 ]; then
            echo "macOS artifacts are not both notarized and stapled; refusing to publish." >&2
            exit 1
          fi
          echo "Both the DMG and the app are notarized and stapled."

      # Collected into one directory so the upload glob does not have to
      # know each platform's bundle layout.
      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          # Not `dist`: that is Vite's build output, which `tauri build`
          # has already populated in this very job. Collecting into it
          # would mix the web bundle in with the installers.
          mkdir -p release-assets
          BASE=src-tauri/target
          if [ -n "${{ matrix.target }}" ]; then BASE="$BASE/${{ matrix.target }}"; fi
          # `.sig` files are the UPDATER's signatures, one per updater
          # bundle. Without them the manifest below has nothing to point
          # at and the plugin refuses every download -- so they are
          # collected here alongside the installers rather than being
          # left in the build tree.
          # NOT '*.tar.gz' or '*.sig' from the bundle tree: that is where
          # Tauri's unversioned `Headstate.app.tar.gz` lives, and copying
          # it shipped two macOS archives whose names differed only by
          # the version. The versioned pair is copied by the step above.
          find "$BASE/release/bundle" -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \
               -o -name '*.deb' -o -name '*.AppImage' \
               -o -name '*.exe.sig' -o -name '*.AppImage.sig' \) \
            -exec cp {} release-assets/ \;
          cp Headstate-*.app.tar.gz release-assets/ 2>/dev/null || true
          cp Headstate-*.app.tar.gz.sig release-assets/ 2>/dev/null || true
          ls -la release-assets
          # A platform that builds but produces nothing must fail here,
          # not silently contribute zero assets to the release.
          [ -n "$(ls -A release-assets)" ] || { echo "no artifacts produced" >&2; exit 1; }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-${{ matrix.os }}
          path: release-assets/*
          if-no-files-found: error

  # One job creates the release, after every platform has succeeded.
  #
  # `needs: build` means a failed platform blocks publication entirely --
  # a release advertising three platforms while shipping one is worse than
  # no release. It also avoids three parallel jobs racing to create the
  # same tag.
  publish:
    # 5-15m measured: it downloads three platforms' artifacts, builds the
    # manifest and uploads. 30 is ample (#885).
    timeout-minutes: 30
    # The ONE job that needs write: it creates the GitHub Release and
    # uploads its assets (#886).
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      # `gh release create` resolves the repository from the git remote, so
      # it fails with "not a git repository" without a checkout -- even
      # though this job builds nothing. Found by the v2.0.1 tag, where all
      # three platforms built and only publication died.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # --generate-notes diffs against the previous tag, which the
          # default depth-1 clone does not have.
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # NOT `dist`: that is Vite's build output directory, and this job
          # checks the repo out. `dist/*` then globbed Vite's `assets/`
          # directory and gh refused it with "is a directory".
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          # Both mean "a secret was present", which is a statement about
          # this repository's configuration and not about the artifacts.
          # That is only safe to print because the macOS build now REFUSES
          # to finish unless `spctl` calls the DMG and the app notarized
          # (see "Verify the macOS artifacts are notarized"), so a build
          # that reaches this job has already proven the claim. Before
          # that check existed, v5.4.1 published "signed and notarized"
          # over a DMG Gatekeeper rejected.
          SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' && 'true' || 'false' }}
          NOTARIZED: ${{ secrets.APPLE_ID != '' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          ls -la release-assets

          # Only regular files. gh refuses a directory with "is a
          # directory" and fails the whole upload, which is how the first
          # v2.0.1 attempt created a release with zero assets.
          # A plain array rather than mapfile: mapfile is bash 4+, and
          # macOS ships bash 3.2 -- so this stays runnable by hand on a
          # dev machine, not only on the runner's bash 5.
          ASSETS=()
          while IFS= read -r f; do ASSETS+=("$f"); done < <(
            find release-assets -maxdepth 1 -type f | sort
          )
          [ ${#ASSETS[@]} -gt 0 ] || { echo "no assets to publish" >&2; exit 1; }
          printf 'publishing %s\n' "${ASSETS[@]}"

          # --generate-notes prepends --notes ahead of the auto-generated
          # changelog, so this reaches every release. Each platform gets
          # only the caveat that applies to it: telling a Windows user to
          # run `xattr` is noise, and saying nothing about SmartScreen
          # means they meet it as a scary dialog instead.
          if [ "$SIGNED" = "true" ] && [ "$NOTARIZED" = "true" ]; then
            MAC="The macOS build is signed and notarized."
          elif [ "$SIGNED" = "true" ]; then
            MAC="The macOS build is signed but not notarized."
          else
            MAC="**macOS** — this build is unsigned. Before first launch, run:

          \`\`\`
          xattr -dr com.apple.quarantine /Applications/Headstate.app
          \`\`\`

          Otherwise Gatekeeper will refuse to open it."
          fi

          # Windows signing is #177's deferred item, parallel to #23 for
          # macOS. An EV certificate is a purchase, and it should not hold
          # up shipping working builds -- but a user should read about
          # SmartScreen here rather than discover it.
          # The self-update asymmetry is stated in the notes rather than
          # left to be discovered (#839). Only the AppImage reaches the
          # updater manifest below, and that is structural rather than an
          # oversight: Tauri produces no updater signature for a `.deb`
          # (the collect glob takes `.sig` files only for `*.exe.sig` and
          # `*.AppImage.sig` because those are the only ones that exist),
          # and `add_platform` correctly refuses to advertise an unsigned
          # bundle. So a `.deb` install finds no matching platform entry
          # and stays on its version indefinitely, with no error and no
          # prompt -- nothing tells the user, it simply never updates.
          #
          # NOT fixed in the pipeline, deliberately. `.deb` self-update is
          # properly apt's job, and inventing one means hosting an apt
          # repository with its own signing keys -- a disproportionate
          # amount of new surface for a platform whose users reasonably
          # expect their package manager to handle updates. Saying so
          # plainly is the honest fix.
          #
          # The arm64 gap is stated in the same place because it has the
          # same shape: a user on that architecture finds no entry for it
          # either. Neither Linux nor Windows arm64 is built -- the
          # Windows matrix entry above has `target: ""`, so it is
          # runner-arch x64 only, and the Linux entry likewise.
          NOTES="$MAC

          **Windows** — this build is unsigned, so SmartScreen will warn on first run. Choose \"More info\" then \"Run anyway\".

          **Linux** — \`.deb\` for Debian and Ubuntu, \`.AppImage\` for everything else. Mark the AppImage executable with \`chmod +x\` before running it.

          The \`.AppImage\` is the auto-updating artifact. The \`.deb\` does **not** self-update — Tauri publishes no updater signature for it, so it is never advertised in the update manifest and a \`.deb\` install stays on the version you installed. Use the AppImage if you want automatic updates, or re-download the \`.deb\` for each release.

          **Architectures** — x86_64 only on Windows and Linux. arm64 builds are not produced for either, so there is nothing for the updater to offer an arm64 install. macOS ships a universal binary and is unaffected."

          # The updater manifest. `latest.json` is what the plugin
          # fetches; it maps each platform to a download URL and the
          # Ed25519 signature the plugin verifies before installing.
          #
          # Built here rather than by a tauri action so the URLs point at
          # THIS tag's assets, and so a missing signature is a hard
          # failure: an entry with no signature would advertise an
          # update the plugin then refuses, which is worse than not
          # advertising it.
          VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_PLATFORMS=""
          add_platform() {
            local key="$1" bundle="$2"
            local sig_file="release-assets/${bundle}.sig"
            [ -f "release-assets/$bundle" ] || return 0
            if [ ! -f "$sig_file" ]; then
              echo "No signature for $bundle; refusing to advertise it." >&2
              exit 1
            fi
            local url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${bundle}"
            local sig
            sig=$(cat "$sig_file")
            MANIFEST_PLATFORMS="${MANIFEST_PLATFORMS}$(printf '"%s":{"signature":"%s","url":"%s"},' "$key" "$sig" "$url")"
          }

          # macOS ships a universal binary, so both architectures resolve
          # to the same bundle.
          add_platform "darwin-aarch64" "Headstate-${GITHUB_REF_NAME}.app.tar.gz"
          add_platform "darwin-x86_64"  "Headstate-${GITHUB_REF_NAME}.app.tar.gz"
          # Exactly one bundle per platform key, asserted before the call
          # rather than discovered afterwards (#896).
          #
          # The globbed platforms previously ran `add_platform` once PER
          # MATCH, so two matching files appended the same key twice and
          # `latest.json` was published with a duplicate
          # `"windows-x86_64"` -- exit 0, nothing downstream objecting.
          # Verified by running the extracted loop against two `.exe`
          # fixtures before fixing it.
          #
          # Nothing caught it. `python3 -m json.tool` accepts duplicate
          # keys (also verified), and #884's assertion below is a
          # substring test for `"windows-x86_64":` -- the key IS present,
          # twice, so it reports nothing. #884 guards the MISSING
          # direction; this is the duplicated one, the mirror image.
          #
          # It matters because the two entries can point at different
          # bundles with different signatures, and which one an updater
          # honours is then whatever its JSON parser happens to do with a
          # repeated key -- last-wins, first-wins or an error, by
          # implementation. A release could hand half its Windows users a
          # bundle whose signature belongs to the other file.
          #
          # The realistic trigger is the same one #884 names: Tauri's
          # NSIS output gaining a variant, an `en-US` locale infix
          # alongside a plain name, or a per-installer-type split. Both
          # land in `release-assets/` and both match `*_x64-setup.exe`.
          #
          # `find` rather than a glob, for a measured reason. With
          # `nullglob` off -- the default, and this shell never sets it --
          # a `for f in <pattern>` with no matches still runs its body
          # ONCE with the pattern as a literal. The old body survived that
          # only because a failing `[ -f ] && cmd` is the one construct
          # `set -e` exempts; written as a bare `[ -f "$f" ]` the same
          # loop exits 1 immediately, and as the last command of a script
          # it exits 1 with no message at all. Both confirmed by probe.
          # Counting with `find` avoids the whole trap instead of
          # tiptoeing around it.
          one_bundle() {
            local key="$1" pattern="$2"
            local matches=()
            while IFS= read -r f; do matches+=("$f"); done < <(
              find release-assets -maxdepth 1 -type f -name "$pattern" | sort
            )
            if [ ${#matches[@]} -gt 1 ]; then
              echo "Ambiguous bundle for ${key}: ${pattern} matched ${#matches[@]} files." >&2
              printf '  %s\n' "${matches[@]}" >&2
              echo "One bundle per platform: a second match publishes a duplicate" >&2
              echo "\"${key}\" key in latest.json, and which entry an updater" >&2
              echo "honours is then whatever its JSON parser does (#896)." >&2
              exit 1
            fi
            # Zero matches is NOT failed here: that is #884's question,
            # and its assertion below reports the whole missing set at
            # once rather than dying on the first gap.
            if [ ${#matches[@]} -eq 1 ]; then
              add_platform "$key" "$(basename "${matches[0]}")"
            fi
          }

          one_bundle "windows-x86_64" '*_x64-setup.exe'
          one_bundle "linux-x86_64" '*_amd64.AppImage'

          if [ -z "$MANIFEST_PLATFORMS" ]; then
            echo "No signed updater bundles; not publishing a manifest." >&2
            exit 1
          fi

          # Every platform the matrix builds must reach the manifest (#884).
          #
          # `add_platform` is asymmetric in the dangerous direction: a
          # missing SIGNATURE hard-fails (correctly -- see above), but a
          # missing BUNDLE does `return 0` and the platform is simply
          # omitted. The `-z` check above is no backstop, since it passes
          # as long as any ONE platform made it. So `latest.json` can be
          # published advertising two platforms out of three with every
          # build leg green, and the third platform's installs then find no
          # matching entry and never update again -- no error, no log, no
          # prompt. Identical in effect to the `.deb` gap described above,
          # except unintended and unannounced.
          #
          # The realistic trigger is a bundle NAME change, not a build
          # failure: Tauri's NSIS output picking up an `en-US` locale infix
          # or an arch suffix, or an AppImage rename on upgrade. `Collect
          # artifacts` globs `*.exe`, so it still copies the file and
          # upload-artifact still succeeds; only the narrower
          # `*_x64-setup.exe` glob here stops matching. Absent silently
          # read as success is this pipeline's characteristic bug class.
          #
          # Zero false positives (the bar #853 set): `needs: build` means
          # all three matrix legs concluded success, and each leg is what
          # produces its own bundle. This asserts exactly what `needs`
          # already guarantees -- the point being that today that guarantee
          # is not carried through to the manifest. The only way to trip it
          # is a real defect: a renamed bundle, or a matrix leg removed
          # without updating this list. macOS contributes two keys from one
          # universal bundle, so both appear or neither does.
          #
          # Collects the whole set before failing rather than dying on the
          # first: if a Tauri upgrade renames two bundles, one run should
          # say so once.
          MANIFEST_MISSING=""
          for key in darwin-aarch64 darwin-x86_64 windows-x86_64 linux-x86_64; do
            case "$MANIFEST_PLATFORMS" in
              *"\"${key}\":"*) ;;
              *) MANIFEST_MISSING="${MANIFEST_MISSING} ${key}" ;;
            esac
          done
          if [ -n "$MANIFEST_MISSING" ]; then
            echo "latest.json would omit:${MANIFEST_MISSING}" >&2
            echo "Every platform the matrix builds must reach the manifest." >&2
            echo "Bundles actually downloaded:" >&2
            ls -1 release-assets >&2
            exit 1
          fi

          printf '{"version":"%s","pub_date":"%s","platforms":{%s}}\n' \
            "$VERSION" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${MANIFEST_PLATFORMS%,}" > release-assets/latest.json
          # Validate the manifest that is actually about to be published,
          # and reject a REPEATED key rather than only malformed JSON
          # (#896).
          #
          # `python3 -m json.tool` used to be this line, and it accepts
          # duplicate keys silently -- verified, so it was never a check
          # on the defect above. Neither is #884's assertion, which asks
          # whether each key appears and is satisfied by a key that
          # appears twice.
          #
          # Kept even though `one_bundle` now closes the only route to a
          # duplicate that we know of. That is the point of asking here
          # instead of only there: this validates the OUTPUT against the
          # defect class, so a future third way of producing a repeated
          # key -- a new platform appended by hand, a key templated from a
          # matrix value, `add_platform` called twice for one platform the
          # way macOS deliberately is for two -- fails at publication
          # rather than reaching users. Input assertions cover the routes
          # you thought of; this covers the shape that is wrong.
          #
          # Exercised directly against a hand-written duplicate manifest
          # rather than through the pipeline, since `one_bundle` makes it
          # unreachable from the glob: it rejects a repeat at any nesting
          # level, `platforms` or top level, and passes a clean manifest.
          #
          # The malformed-JSON check `json.tool` was here for is NOT lost:
          # `JSONDecodeError` subclasses `ValueError`, so the one `except`
          # catches a truncated manifest and an unescaped quote as well as
          # a duplicate key. Confirmed against all three.
          python3 - release-assets/latest.json <<'VALIDATE_MANIFEST'
          import collections, json, sys

          def no_dupes(pairs):
              counts = collections.Counter(k for k, _ in pairs)
              dupes = sorted(k for k, n in counts.items() if n > 1)
              if dupes:
                  raise ValueError("duplicate key(s): " + ", ".join(dupes))
              return dict(pairs)

          path = sys.argv[1]
          try:
              json.loads(open(path).read(), object_pairs_hook=no_dupes)
          except ValueError as e:
              sys.exit(f"{path} is not a publishable updater manifest: {e}")
          VALIDATE_MANIFEST
          ASSETS+=("release-assets/latest.json")

          # Idempotent: a rerun after a partial failure -- exactly what
          # happened on the first v2.0.1 attempt, where all three platforms
          # built and only this job died -- must upload to the existing
          # release rather than failing on "already exists".
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release exists; uploading assets to it."
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Headstate ${GITHUB_REF_NAME}" \
              --notes "$NOTES" \
              --generate-notes \
              "${ASSETS[@]}"
          fi
