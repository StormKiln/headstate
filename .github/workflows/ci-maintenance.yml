name: CI maintenance

# Only trusted default-branch code executes with cancellation permission.
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-maintenance
  cancel-in-progress: false

jobs:
  ci-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify cancellation policy
        run: python3 scripts/ci-maintenance.test.py
      - name: Cancel obsolete queue work and report CI timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-maintenance.py --apply
